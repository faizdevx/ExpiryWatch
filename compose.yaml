services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: expirywatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: expirywatch
    ports:
      # 5433 on the host so it never collides with a locally installed Postgres.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expirywatch -d expirywatch"]
      interval: 5s
      timeout: 3s
      retries: 10
      # First boot runs initdb, which can take minutes on a slow Docker disk.
      start_period: 5m
      start_interval: 2s

volumes:
  postgres_data:
